[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnagent"
version = "2.1.0"
description = "Local, evidence-grounded code security scanner with an optional Ollama AI agent and a localhost web UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests>=2.31.0", "flask>=3.0", "reportlab>=4.0", "python-docx>=1.1", "pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
streamlit = ["streamlit>=1.30"]
a01 = ["tree-sitter>=0.22", "tree-sitter-javascript>=0.23", "tree-sitter-typescript>=0.23", "tree-sitter-java>=0.23", "tree-sitter-c-sharp>=0.23"]

[project.scripts]
vulnagent = "vulnagent.__main__:main"

[tool.setuptools.packages.find]
include = ["vulnagent*"]

[tool.setuptools.package-data]
vulnagent = ["web/templates/*.html", "web/static/*", "a01/rules.json"]
