<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VulnAgent{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <header class="site-head">
    <div class="wrap">
      <a class="brand" href="{{ url_for('index') }}">VulnAgent</a>
      <span class="ver">Local code security review, version {{ version }}</span>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer>
    <div class="wrap">Runs on this computer. Findings are automated and need human review.</div>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
